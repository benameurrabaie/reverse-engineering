<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reverse Engineering MOOC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbfdff;--card:#fff;--ink:#233152;--mute:#6d7a96;--line:#ebf0fa;--a:#9cc4ff;--sh:0 10px 34px rgba(120,150,210,.13);--ok:#2f9e77;--no:#d9534f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141b2d;--card:#1c2540;--ink:#e8edfa;--mute:#9aa8c7;--line:#2c3757;--ok:#5fd4a6;--no:#ff8a84;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141b2d;--card:#1c2540;--ink:#e8edfa;--mute:#9aa8c7;--line:#2c3757;--ok:#5fd4a6;--no:#ff8a84;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--a);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 18px;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px}
.bar{flex:1;min-width:120px;height:10px;background:var(--line);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#8ee0c8,#6ea8fe,#c3b3ff);width:0;transition:width .5s}
.btn{border:0;border-radius:14px;padding:11px 20px;font-weight:700;background:var(--a);color:#0f2147}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
main{max-width:1060px;margin:0 auto;padding:22px 18px 60px}
.hero{border-radius:28px;padding:44px 32px;background:linear-gradient(135deg,#dbe8ff,#d6f5ec 55%,#e6dfff);color:#1c2a4a}
.hero h1{font-size:clamp(30px,5vw,52px);line-height:1.1;margin:0 0 14px;font-weight:800}
.hero p{max-width:560px;margin:0 0 22px}
.hero input{padding:12px 16px;border-radius:14px;border:1.5px solid #c9d6f0;font:inherit;min-width:220px;margin-right:8px;color:#1c2a4a;background:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-top:22px}
.tile{padding:16px;border-radius:18px;background:color-mix(in srgb,var(--cc) 30%,var(--card))}
.tile b{display:block}.tile small{color:var(--mute)}
.layout{display:block}
nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}nav button{white-space:normal;padding:8px 12px;font-size:14px}.secnav{margin-bottom:18px}.secnav a{text-decoration:none;color:var(--ink);font-size:14px;font-weight:700;padding:7px 14px;border-radius:99px;background:color-mix(in srgb,var(--cc) 35%,var(--card))}.card{scroll-margin-top:80px}
nav button{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;font-weight:500}
nav button.on{background:color-mix(in srgb,var(--cc) 40%,var(--card));border-color:var(--cc);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:22px;margin-bottom:18px}
h2{margin:0 0 4px;font-size:26px}h3{margin:0 0 12px;font-size:19px}
.lead{color:var(--mute);margin:0 0 14px}
.defs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.def{padding:14px;border-radius:16px;background:color-mix(in srgb,var(--cc) 22%,var(--card))}
.def b{display:block;margin-bottom:4px}
svg text{font-family:inherit}
.vid{border-radius:18px;overflow:hidden;border:1px solid var(--line)}
.vid .cap{padding:12px 16px;min-height:62px;background:color-mix(in srgb,var(--cc) 18%,var(--card))}
.ctl{display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--card)}
.ctl .bar{height:8px}
.step{display:flex;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.step:last-child{border:0}.step input{width:20px;height:20px;margin-top:3px;accent-color:var(--ok)}
.step span{display:block;color:var(--mute);font-size:15px}
.step input:checked+div b{text-decoration:line-through;opacity:.6}
.q{margin-bottom:16px}.q p{font-weight:700;margin:0 0 8px}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 18%,var(--card))}
.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 18%,var(--card))}
.score{font-weight:800;color:var(--ok)}
.cert{text-align:center;padding:36px 22px;border-radius:26px;background:linear-gradient(135deg,#d6f5ec,#dbe8ff,#e6dfff);color:#1c2a4a}
.cert h1{margin:6px 0;font-size:clamp(26px,4vw,40px)}
.stars button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;width:42px;height:42px;font-weight:700;margin-right:6px}.stars .on{background:color-mix(in srgb,var(--a) 45%,var(--card));border-color:var(--a)}
table{width:100%;border-collapse:collapse}td{padding:9px 6px;border-bottom:1px solid var(--line)}
textarea{width:100%;min-height:80px;border-radius:12px;border:1.5px solid var(--line);padding:10px;font:inherit;background:var(--card);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.stp{padding:7px 14px;border-radius:99px;background:var(--line);color:var(--mute);font-size:14px;font-weight:700}.stp.on{background:color-mix(in srgb,var(--a) 35%,var(--card));color:var(--ink)}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.fact{padding:14px;border-radius:16px;background:color-mix(in srgb,var(--a) 14%,var(--card));font-weight:700}.fact small{display:block;color:var(--mute);font-weight:400}
.opt.sel{border-color:var(--a);background:color-mix(in srgb,var(--a) 22%,var(--card))}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}.two .card{margin:0}
.who{display:flex;gap:14px;align-items:center}.av{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#8ee0c8,#c3b3ff);display:grid;place-items:center;font-size:30px;flex:none}
ul.ck{padding-left:20px;margin:0}ul.ck li{margin:7px 0}
.fig{margin:0}.fig img{width:100%;border-radius:16px;border:1px solid var(--line);display:block}.fig figcaption{color:var(--mute);font-size:14px;margin-top:8px}
pre{overflow-x:auto;background:color-mix(in srgb,var(--a) 12%,var(--card));border:1px solid var(--line);border-radius:14px;padding:12px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;margin:12px 0}
.mini{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:4px}.mini i{display:block;height:100%}
@media(max-width:780px){nav{flex-wrap:wrap}}
header{background:color-mix(in srgb,var(--card) 84%,transparent);backdrop-filter:blur(12px);padding:12px 22px}
.card{border-radius:26px;padding:28px;box-shadow:var(--sh,none)}
.card h3{font-size:20px;letter-spacing:-.01em}
h2{letter-spacing:-.02em}
.hero{border-radius:32px;padding:58px 40px;background:linear-gradient(135deg,#eaf3ff,#e8fbf4 55%,#f2edff);box-shadow:var(--sh,none)}
.cert{border-radius:32px;background:linear-gradient(135deg,#eaf3ff,#e8fbf4 55%,#f2edff);box-shadow:var(--sh,none)}
.btn{border-radius:999px;padding:12px 26px;background:linear-gradient(135deg,#bcd9ff,#cdf3e6);color:#1b2c52;box-shadow:0 4px 14px rgba(120,160,220,.22);transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:transparent;box-shadow:none}
nav button{border-radius:999px;background:var(--card)}
nav button.on{background:color-mix(in srgb,var(--cc) 30%,var(--card));border-color:var(--cc)}
nav button.done{border-color:#9ee3c9;background:color-mix(in srgb,#9ee3c9 25%,var(--card))}
.secnav a{background:color-mix(in srgb,var(--cc) 22%,var(--card))}
.def{background:color-mix(in srgb,var(--cc) 16%,var(--card))}
.tile{background:color-mix(in srgb,var(--cc) 20%,var(--card))}
.def,.tile,.fact,.fig img{border-radius:20px}
.opt{border-radius:16px}
.av{font-size:0}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:22px;align-items:start}
.layout>nav:first-child{grid-column:1/-1}
.secnav{flex-direction:column;flex-wrap:nowrap;position:sticky;top:84px;gap:4px;margin:0;max-height:calc(100vh - 110px);overflow-y:auto}
.secnav::before{content:var(--insch,"In this chapter");font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--mute);padding:0 12px 6px}
.secnav a{white-space:normal;border-radius:14px;background:transparent;font-weight:500;padding:9px 12px;border-left:3px solid transparent;color:var(--mute);transition:background .2s}
.secnav a.on{background:color-mix(in srgb,var(--cc) 28%,var(--card));color:var(--ink);font-weight:700;border-left-color:var(--cc)}
@media(max-width:860px){.layout{grid-template-columns:160px minmax(0,1fr);gap:14px}.secnav a{font-size:13px;padding:8px 9px}.card{padding:20px}}
@media(max-width:520px){.layout{grid-template-columns:116px minmax(0,1fr);gap:10px}.secnav a{font-size:12px;padding:6px 7px}.secnav::before{font-size:10px;padding:0 7px 4px}main{padding:16px 10px 50px}.card{padding:16px;border-radius:20px}}
.lg{display:flex;gap:4px}.lg button{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}.lg button.on{background:color-mix(in srgb,var(--a) 40%,var(--card));border-color:var(--a)}
@media print{header,.row,.noprint{display:none!important}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

try{Object.assign(S,JSON.parse(localStorage.getItem('remooc')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('remooc',JSON.stringify({name:S.name,done:S.done,sc:S.sc,ent:S.ent,exam:S.exam,ul:S.ul,lang:S.lang}))}catch(e){}};
const $=id=>document.getElementById(id);
const nDone=()=>Object.keys(S.done).length;
function prog(){$('pg').style.width=nDone()*100/C.length+'%';$('pt').textContent=nDone()+'/'+C.length}
function stop(){if(T){clearInterval(T);T=null}}
function go(v){stop();S.view=v;render();scrollTo(0,0)}
function pick(i){stop();P=0;S.ch=i;render();scrollTo(0,0)}

function pipe(c,act){
  const g=c.nodes.map((n,i)=>{const x=22+i*155,on=i===act;
    return `${i?`<path d="M${x-22} 70h18m-6-6l6 6-6 6" stroke="var(--mute)" fill="none" stroke-width="2"/>`:''}
    <rect x="${x}" y="22" width="130" height="100" rx="20" style="fill:color-mix(in srgb,${c.c} ${on?55:28}%,var(--card));stroke:${on?'var(--a)':'var(--line)'};stroke-width:${on?3:1.5}"/>
    <text x="${x+65}" y="70" font-size="34" text-anchor="middle">${n[0]}</text>
    <text x="${x+65}" y="104" font-size="14" font-weight="700" text-anchor="middle" fill="var(--ink)">${n[1]}</text>`}).join('');
  return `<svg viewBox="0 0 640 144" width="100%" role="img" aria-label="${c.t} workflow">${g}</svg>`}

function drawVid(){const c=C[S.ch],s=Math.min(3,Math.floor(P/4000));
  $('vs').innerHTML=pipe(c,s);$('vc').textContent=c.cap[s];
  $('vb').style.width=P/160+'%';$('vt').textContent=(P>=16000?'Replay':T?'Pause':'Play');
  $('vp').textContent=Math.floor(P/1000)+'s / 16s'}
function playV(){if(T){stop()}else{if(P>=16000)P=0;T=setInterval(()=>{P+=100;if(P>=16000){P=16000;stop()}drawVid()},100)}drawVid()}

function quizHTML(){const c=C[S.ch],a=A[S.ch]||{};
  const q=c.quiz.map((q,qi)=>`<div class="q"><p>${qi+1}. ${q[0]}</p>${q[1].map((o,oi)=>{
    const k=a[qi]==null?'':(oi===q[2]?'ok':(oi===a[qi]?'no':''));
    return `<button class="opt ${k}" ${a[qi]!=null?'disabled':''} onclick="ans(${qi},${oi})">${o}</button>`}).join('')}</div>`).join('');
  const n=Object.keys(a).length,prev=S.sc[S.ch];
  const st=n===3?`<p class="score">Your score: ${S.sc[S.ch]}/3 — chapter complete.</p><button class="btn ghost" onclick="retry()">Try again</button>`:(prev!=null?`<p class="lead">Previous score: ${prev}/3. Answer again to improve it.</p>`:'');
  return q+st}
function ans(qi,oi){A[S.ch]=A[S.ch]||{};if(A[S.ch][qi]!=null)return;A[S.ch][qi]=oi;
  const a=A[S.ch];if(Object.keys(a).length===3){S.sc[S.ch]=C[S.ch].quiz.filter((q,i)=>a[i]===q[2]).length;S.done[S.ch]=1;save();prog();
    document.querySelectorAll('nav button')[S.ch].classList.add('done');}
  $('quiz').innerHTML=quizHTML()}
function retry(){A[S.ch]={};$('quiz').innerHTML=quizHTML()}

const SEC0=[[
['From source code to executable','Compilation has four stages: preprocessing, compiling to assembly, assembling into object files, and linking everything into one executable. Optimizations may inline functions, reorder code or remove variables, which is why compiled code rarely looks like the source. Debug symbols keep function and variable names when present; stripped binaries do not, so the analyst must rebuild meaning from behavior.'],
['Number systems and data representation','Machine data is binary, usually shown in hexadecimal. Signed integers use two\u2019s complement, text uses encodings such as ASCII and UTF-8, and multi-byte values are stored in little-endian order on x86 and most ARM systems, so 0x1234 appears in memory as 34 12. Recognizing these patterns is essential when reading raw memory or a hex dump.'],
['The CPU, registers and instructions','On x86-64 the general registers are rax, rbx, rcx, rdx, rsi, rdi, rsp, rbp and r8 to r15. The register rsp points to the top of the stack and rip to the next instruction. Common instructions are mov (copy), add and sub (arithmetic), cmp (compare), jmp and conditional jumps, call and ret. Flags such as the zero flag store the result of a comparison for the next jump.'],
['Memory layout and function calls','A running process has a code segment, a data segment, a heap and a stack. A call pushes the return address, and the called function builds a stack frame for its local variables. On Linux x86-64 the first arguments travel in rdi, rsi, rdx, rcx, r8 and r9, and the result returns in rax. Knowing this lets you identify parameters and return values directly in assembly.']],[
['Triage and file identification','Before disassembling, collect cheap facts: file type, size, SHA-256 hash, compiler and packer signatures, section names and entropy. High entropy in a section suggests compression or encryption. Hashes let you compare the sample with known databases, and strings and imports often reveal URLs, file paths, error messages and API names.'],
['Disassembly strategies','Linear sweep decodes instructions one after another, while recursive descent follows jumps and calls from known entry points. Recursive descent avoids decoding data as code but can miss indirect jumps. Tools such as Ghidra, IDA Free, radare2 and objdump combine both approaches. Always verify function boundaries when the result looks wrong.'],
['Control flow and recognizing patterns','Learn to recognize compiled constructs: a cmp followed by a conditional jump is an if, a backward jump forms a loop, and a jump table indicates a switch. Function prologues (push rbp, mov rbp, rsp) and epilogues mark function boundaries. Library functions such as strcpy or memcmp, recognized by signatures, save a lot of time.'],
['Decompiling and documenting','Decompilers like Ghidra produce C-like code, but they guess types and may merge or split variables. Improve the result by defining structures, fixing function signatures and renaming symbols. Keep notes on every assumption, link each finding to an address, and summarize what each function does, so another analyst can repeat your work.']],[
['Building a safe analysis lab','Use a virtual machine, take a clean snapshot, disable shared folders and clipboard, and route the network through a host-only or simulated network. Install the debugger, a process monitor and a packet capture tool in the guest. Revert to the snapshot after each run so results are repeatable and your real system stays safe.'],
['Debugger workflow','Start by setting a breakpoint at the entry point or at a function found statically. Use step into to follow calls and step over to skip them. At each stop, read registers, the stack and memory, then continue. Conditional breakpoints stop only when a value matches, and watchpoints stop when a memory address changes.'],
['Tracing and monitoring','Tracers record behavior without manual stepping. strace shows system calls such as open, read, connect and execve, ltrace shows library calls, and process monitors list file, registry and network activity. Frida can hook functions to print their arguments and return values. Compare these logs with static findings to confirm what each function does.'],
['Anti-analysis techniques and countermeasures','Programs may detect debuggers (for example by checking a flag or timing), detect virtual machines, or decrypt their code only at run time. Countermeasures include patching the check, hiding the debugger, dumping memory after unpacking and then analyzing the unpacked code statically. Document each technique, because it also tells you about the author.']],[
['Vulnerability analysis','Typical memory-safety bugs are buffer overflows, use-after-free, integer overflows and format-string errors. Analysts look for them by reviewing code that copies input, then confirm them with fuzzing and debugging. Defenses such as stack canaries, ASLR and non-executable memory make exploitation harder, and understanding them guides both research and secure design.'],
['Malware analysis workflow','A solid workflow runs in order: safe triage, static analysis, dynamic analysis, then reporting. Analysts identify persistence (startup entries, services), communication (domains, protocols), payloads and self-protection. Behaviors are mapped to frameworks such as MITRE ATT&CK so defenders can write detections.'],
['Digital forensics and incident investigation','Forensics preserves evidence first: make disk and memory images, record hashes and keep a chain of custody. Analysts then build a timeline from logs, file times and memory artifacts. Reverse engineering helps explain unknown binaries found during the investigation and extract indicators to search for on other machines.'],
['Ethics, law and professional practice','Rules differ by country, but common principles hold: analyze only what you own or are authorized to study, respect licenses and their reverse-engineering clauses, protect personal data found in samples, and disclose flaws responsibly with a clear timeline. Never publish working exploits or live malware, and document your methods and limits honestly.']]];
const INTRO=[['A computer cannot read programs the way people write them. It only follows very simple instructions made of numbers. In this chapter you learn, step by step, how a program written by a person becomes something a computer can run.','Reverse engineering means studying a finished product to understand how it was made. Here the product is a program, so we first learn how programs are made.'],['Sometimes you receive a finished program without the instructions its author wrote. Static analysis means studying that program without running it, like reading a recipe instead of cooking it. This chapter shows how.'],['Dynamic analysis means studying a program while it runs, like watching a cook at work instead of reading the recipe. It shows what the program really does, but it must be done carefully and safely.'],['Reverse engineering helps people protect computers: finding weaknesses, understanding harmful programs and investigating incidents. Because this power can be misused, this chapter also explains the rules you must follow.']];

[['Dynamic analysis','Studying a program while it is running.'],['Debugger','A tool that lets you pause a running program and look inside it.'],['Breakpoint','A mark you place in a program so that it pauses there.'],['Memory','The place where a computer keeps data and running programs for a short time.'],['Virtual machine','A pretend computer running inside your real one, so a risky program cannot harm your real system.'],['Snapshot','A saved copy of a virtual machine that you can restore at any time.']],

const SEC=[[
['How a program is made','People write programs in source code, which looks a bit like English with strict rules. A computer cannot understand it directly, so a compiler (a translator program) converts it into machine code. A second tool then joins all the pieces into one finished file, called an executable. When you double-click an application, you are running an executable. After translation the original names and comments are usually lost, which is why reverse engineering is like solving a puzzle.','Source code goes into the compiler and an executable file comes out.'],
['Why computers use 0 and 1','A computer is made of tiny switches that are either off or on. We write off as 0 and on as 1. A single 0 or 1 is called a bit, and a group of 8 bits is a byte. With bits we write numbers: 101 in binary means 5, because it counts 4 + 0 + 1. Letters are stored as numbers too, so the letter A is the number 65. Long binary numbers are hard to read, so people often use hexadecimal (base 16, digits 0 to 9 and A to F), where FF means 255.','A row of switches showing bits and the number 5.'],
['What the processor does','The processor, also called the CPU, is the brain of the computer. It repeats a simple cycle: fetch the next instruction from memory (the place where running programs and their data are kept), understand it, and do it. The CPU has a few very small, very fast storage boxes called registers, where it keeps the numbers it is working on. Each instruction is tiny, such as copy a number or add two numbers, but billions per second make complex programs possible.','The CPU fetching instructions from memory and using registers.'],
['Where a running program keeps its data','While a program runs, its data lives in memory. Two areas matter most. The stack is a tidy pile used for the temporary notes of each function (a function is a named part of a program that does one small job): when a function starts, a new note is put on top, and when it finishes, the note is removed. The heap is a larger free area where a program asks for space when it needs more. Knowing this helps you follow a program step by step.','A stack of notes growing and shrinking, next to the heap.']],[
['First look at an unknown file','Before reading any instruction, collect easy facts. What type of file is it, and how big? Its hash is a short fingerprint calculated from the file: if even one bit changes, the fingerprint changes, so it identifies the exact file. You can also list its strings, the pieces of readable text inside the program such as messages and web addresses. A web address found in a string can already hint at what the program does.','A file with its type, size, hash and a list of strings.'],
['Reading the program in assembly','A disassembler shows machine code as assembly, a readable form with short words: mov means copy, add means add, cmp means compare two values and jmp means jump to another place in the program. For example, cmp followed by a conditional jump means: if two values are equal, go somewhere else. This is how a program makes decisions. At first it is slow to read, but a few common patterns cover most of what you will see.','Machine code on the left, assembly on the right.'],
['Seeing the shape of the program','Tools draw a control-flow graph: boxes of instructions joined by arrows showing where the program can go next. A box that splits into two arrows is a decision (an if). An arrow that goes back to an earlier box is a loop, meaning the program repeats something. This map makes it easier to find the important decision, such as where a password is checked.','Boxes and arrows showing a decision and a loop.'],
['From assembly to readable code','A decompiler tries to rebuild readable code from the assembly. It is a smart guess: the original names are lost, so it invents names like var1. Your job is to improve it: rename things once you understand them, add notes, and check against the assembly. Write down every finding with the address where you found it, so another person can repeat your work.','Assembly on one side, guessed readable code with renamed names on the other.']],[
['Why we run programs on purpose','Reading a program is slow, and some programs hide their real instructions until they run. Running them lets you see the real result, such as hidden text or the files they touch. The danger is that a program may be harmful. That is why dynamic analysis is always done in a safe place, never on your main computer.','A running program being observed through a window.'],
['Building a safe lab','A virtual machine is a pretend computer running inside your real one. If something goes wrong, only the pretend computer is affected. Before each test, take a snapshot, a saved copy of the pretend computer, and restore it afterwards so every test starts from the same clean state. Also disconnect it from your real network and your personal files.','A real computer containing a virtual machine with a snapshot.'],
['Pausing a program to look inside','A debugger is a tool that controls a running program. You place a breakpoint, a mark where the program must stop. When it stops, you can read the values in memory and registers. You can then use step to run one instruction at a time and watch what changes. It is like pausing a film and looking at each frame.','A program paused at a breakpoint with its values displayed.'],
['Watching what a program asks the system','Programs ask the operating system (the main software that manages the computer, such as Windows or Linux) to do things like open a file or connect to the internet. These requests are called system calls, and tools can record them in a log. A program that opens many files and then sends data over the network tells you a lot about its purpose, even before you understand its instructions.','A log of system calls: open file, read, connect.']],[
['What is a vulnerability?','A vulnerability is a weakness, like a door left unlocked by mistake. A common example is a buffer overflow: a program reserves a small box in memory for data, but an attacker sends more data than fits, and the extra spills into the next area and can change how the program behaves. Finding such weaknesses first lets the maker fix them before attackers use them.','A small box overflowing into its neighbor.'],
['Studying harmful programs','Malware is a program made to harm or spy. To study it safely, analysts follow an order: first look without running it, then run it in a virtual machine, then write a report. They look for how it stays on a computer after a restart, which web addresses it contacts and what it changes. Each clue, such as a file fingerprint or a web address, is an indicator of compromise, and defenders use these to find other infected computers.','Steps: look, run safely, find clues, write a report.'],
['Investigating an incident','Digital forensics starts by protecting the evidence. Investigators make an exact copy of the disk and record its fingerprint, so nobody can claim the data was changed. They then build a timeline of what happened using logs and file dates. When they find an unknown program, reverse engineering explains what it did.','A timeline of events with an evidence copy.'],
['Rules you must follow','Studying programs gives you power, so rules matter. Study only software you own or have written permission to study, because laws on copyright and computer misuse are strict and differ by country. If you find a weakness, practice responsible disclosure: tell the maker privately and give time to fix it. Never share working attack tools or live harmful programs, and always report honestly what you did.','A checklist: permission, safe lab, private report.']]];

const NEW=[
{t:'Assembly Language Basics',c:'#ffe29a',d:'Read the simple instructions a processor follows.',
intro:['Assembly is the most readable form of machine code. Learning a handful of instructions lets you read most programs. We use the x86 family of processors, found in most PCs, as the example.'],
gl:[['Instruction','One tiny command for the processor, such as copy or add.'],['Register','A very small, very fast storage box inside the processor.'],['Operand','The value or place an instruction works on, such as the numbers in add a, b.'],['Flag','A one-bit note the processor sets after an instruction, for example whether a result was zero.']],
sec:[['Instructions and registers','An assembly line has an instruction name and operands, such as mov eax, 5, which copies the number 5 into the register named eax. Other common instructions are add (add), sub (subtract) and cmp (compare two values). x86 gives registers names like eax, ebx, ecx and edx for general work. Reading assembly means following which register holds which value after each line.','One instruction with its name and operands labeled.'],['Decisions and loops','After cmp, the processor sets flags, such as zero when the two values were equal. A jump instruction uses these flags: je jumps if equal, jne jumps if not equal and jmp always jumps. A jump backward creates a loop, where the same lines repeat. So cmp followed by je is how assembly writes an if.','A compare followed by a jump arrow.'],['Functions, the stack and a worked example','To use a function, the program uses call, which saves where to come back to on the stack and jumps into the function; ret comes back. The instruction push puts a value on the stack and pop takes it off. Example: mov eax, 2 then add eax, 3 then cmp eax, 5 then je done. The register eax becomes 5, the compare finds equal values, and the jump to done is taken.','A step table showing eax changing from 2 to 5.']],
tut:[['Trace by hand','Follow mov a, 4 then add a, 6 then sub a, 3 and write a after each line. (Answer: 4, 10, 7)'],['Decide the jump','If cmp compares 7 and 7 and then je follows, is the jump taken? (Yes)'],['Describe a loop','Describe in words a loop that adds 1 to a counter until it equals 5.']],
quiz:[['What does mov eax, 5 do?',['Copies 5 into eax','Adds 5 to eax','Jumps to line 5'],0],['Which instruction jumps only when two compared values are equal?',['jmp','je','ret'],1],['What does ret do?',['Pushes a value','Compares two values','Returns from a function'],2]],
x:[['What does the add instruction do?',['Adds two values','Copies a file','Ends a program'],0],['A jump going backward creates\u2026',['A comment','A loop','A register'],1]]},
{t:'Network Monitoring Basics',c:'#bfeaff',d:'Watch what a program says to other computers.',
intro:['Most programs talk to other computers. Watching that conversation shows what a program sends, to whom and why, without reading a single instruction. This is network monitoring.'],
gl:[['Network','Computers connected so they can exchange data.'],['Packet','A small piece of data sent over a network, with a sender and a receiver address.'],['IP address and port','The IP address identifies a computer; the port is a numbered door on it for one service, such as 443 for secure websites.'],['Protocol','An agreed set of rules for a conversation, such as HTTP for web pages and DNS for finding addresses.']],
sec:[['How computers talk','Data travels in packets. Each packet carries the sender and receiver IP addresses, the port numbers and a payload, which is the actual data. A protocol decides the order of messages. DNS turns a name like example.com into an IP address. HTTP carries web requests, and HTTPS is HTTP with encryption so outsiders cannot read the payload.','A packet with its header fields and payload.'],['Capturing and reading traffic','A packet capture tool such as Wireshark records the packets on a network connection and shows them one by one. You can filter, for example to show only DNS or only one address. Always capture inside a virtual machine, because the program under study may be harmful. The list of addresses and domains a program contacts is often the quickest clue to its purpose.','A list of captured packets with a filter box.'],['Spotting suspicious behavior','Look for names that look random, connections at fixed time intervals (a program calling home), large uploads and unusual ports. Because HTTPS hides payloads, analysts rely on metadata, which means facts about the traffic such as who, when, how often and how much. Record each domain and address as a clue for the final report.','A timeline showing a program contacting one address every minute.']],
tut:[['List the conversation','Opening a web page: write the steps DNS lookup, connection, request and answer.'],['Read a packet','Draw a packet and label sender, receiver, port and payload.'],['Judge a log','A program contacts one unknown address every 60 seconds. Write two possible explanations.']],
quiz:[['What does DNS do?',['Encrypts files','Turns a name into an IP address','Stores passwords'],1],['What is a payload?',['The data a packet carries','A sender address','A port number'],0],['Why capture traffic in a virtual machine?',['It is faster','It hides the packets','The program might be harmful'],2]],
x:[['Which tool records and displays packets?',['A compiler','Wireshark','A text editor'],1],['Connections at fixed intervals to one address may show\u2026',['A program calling home','A screen saver','A faster CPU'],0]]},
{t:'Memory Analysis',c:'#ffc9d9',d:'Look at what a computer holds in memory while it runs.',
intro:['Memory holds everything a computer is doing right now. Capturing it freezes one moment in time, so you can search it later for programs, secrets and hidden activity.'],
gl:[['Memory dump','A saved copy of everything in memory at one moment.'],['Process','A running copy of a program.'],['Hex editor','A tool that shows raw data as numbers in hexadecimal.'],['Unpacking','Removing the layer that hides a program, so its real code can be seen.']],
sec:[['Why memory is valuable','Programs are often hidden or encrypted on disk, but the processor must be able to read them when they run. So the real code and data appear in memory. A memory dump saves this moment. It can show running processes, open network connections and secrets that never reach the disk.','Disk with hidden code versus memory with readable code.'],['Taking and exploring a dump','Tools such as Volatility list the processes found in a dump, their connections and the files they opened. You can also search the dump for strings, the readable text introduced earlier. Look for processes with strange names, or one running from an odd folder. Keep the dump unchanged, work on a copy and record its hash.','A process list from a dump with one odd entry highlighted.'],['Reading raw bytes and unpacking','A hex editor shows raw bytes as pairs of hexadecimal digits, with the matching text on the right. Known files start with fixed markers called magic numbers: a Windows program starts with the letters MZ. When a program unpacks itself in memory, dump it after it has unpacked and analyze the clean copy with the static methods from earlier chapters.','A hex editor with MZ highlighted at the start.']],
tut:[['List what memory holds','Write five things that are in memory while you browse the web.'],['Spot the odd process','Given notepad, chrome, svch0st and explorer, which looks wrong and why?'],['Find the marker','Explain why a file that starts with MZ is probably a Windows program.']],
quiz:[['What is a memory dump?',['A copy of memory at one moment','A deleted file','A type of virus'],0],['Why does hidden code appear in memory?',['Disks are slower','It must be readable to run','Memory is bigger'],1],['What is a magic number?',['A password','A random value','A fixed marker at the start of a file type'],2]],
x:[['A running copy of a program is called\u2026',['A process','A packet','A string'],0],['Why work on a copy of a memory dump?',['It is smaller','To keep the original unchanged','To make it faster'],1]]},
{t:'File Formats & Protocols',c:'#d4f2a8',d:'Discover how unknown data is organized.',
intro:['Sometimes you have data but no description of how it is organized. Reverse engineering a format means finding the rules that make the data readable, like learning the grammar of an unknown language.'],
gl:[['File format','The rules for how information is arranged inside a file.'],['Header','The first bytes of a file or packet, describing what follows.'],['Field','One named piece of data, such as a length or a date.'],['Endianness','The order in which the bytes of a number are stored.']],
sec:[['What a format looks like','A format usually starts with a header: a fixed marker, a version number and sizes. After it come the fields and the data. Many fields use a few common shapes: numbers, text, and lengths followed by data of that length. By comparing several files you can see which bytes always stay the same and which change.','A file split into header, fields and data with colors.'],['Finding the structure','Open samples in a hex editor and change one thing at a time in the program that creates them, such as a name or a date, then see which bytes change. A number may be stored with the small end first, a choice called little-endian, so 0x1234 appears as 34 12. Take notes in a table: offset (the position in the file), size and meaning.','Two files compared with the changed bytes highlighted.'],['Network protocols and documenting','Network protocols are reverse engineered the same way: capture packets, compare messages and find the fields for command, length and data. When you understand the format, write a clear specification and a small tool that reads it. Check your tool against more samples, and respect the law and licenses that apply to the format.','A table with offset, size and meaning for each field.']],
tut:[['Compare two files','Save a note twice, changing one word, and imagine which bytes would differ.'],['Write an offset table','Make a table of offset, size and meaning for a made-up header: marker, version, length.'],['Read a number','The bytes 34 12 in little-endian form 0x1234. What do 78 56 form? (Answer: 0x5678)']],
quiz:[['What does a header do?',['Describes what follows','Deletes data','Encrypts a file'],0],['Little-endian means\u2026',['Biggest byte first','Smallest byte first','No byte order'],1],['Why compare several sample files?',['To use more disk','To save typing','To see which bytes stay the same and which change'],2]],
x:[['What is an offset?',['A position in a file','A kind of virus','A password'],0],['Which is a good way to find a field?',['Guess randomly','Change one input and see which bytes change','Delete the file'],1]]},
{t:'Mobile & Web Apps',c:'#c9d6ff',d:'Study apps built for phones and browsers.',
intro:['Many programs today are phone apps and websites. Their code is often easier to read than compiled programs, so they are a good first practice.'],
gl:[['App package','The single file that contains an app, such as an APK on Android.'],['JavaScript','The language that runs inside web pages in your browser.'],['Bytecode','An in-between code that a virtual machine runs, used by Android and Java apps.'],['Minification','Shrinking code by removing spaces and shortening names, which makes it harder to read.']],
sec:[['Android apps','An Android app is delivered as an APK, which is really a compressed archive. Inside are the app code in bytecode form, images, and a manifest file listing what the app may do, such as use the camera. Tools like jadx convert the bytecode back to readable Java-like code. Start with the manifest, because its permissions show what the app can access.','An APK opened to show its manifest, code and images.'],['Websites and JavaScript','A browser downloads a page and its JavaScript, so anyone can read them. The developer tools built into the browser show the code, the requests it makes and the data it stores. Code is often minified, but a formatting tool puts the spaces back. Following a request from a button click to the server shows how the site works.','Browser developer tools showing a request.'],['Obfuscation and safe testing','Authors may use obfuscation, which scrambles names and logic to hide intent. Renaming symbols as you understand them and watching network traffic, as in the earlier chapter, both help. Test apps on an emulator or a spare device, not your personal phone, and only study apps you are allowed to study.','Scrambled code beside the cleaned version.']],
tut:[['Read a manifest','List three permissions you would find suspicious for a flashlight app.'],['Open developer tools','In your browser press F12 on any page and name three tabs you see.'],['Clean minified code','Rewrite var a=1;var b=2; with spaces and clear names such as price and tax.']],
quiz:[['What is an APK?',['A website','The package file of an Android app','A network protocol'],1],['What does a manifest list?',['The permissions and parts of an app','Only images','User passwords'],0],['What does minification do?',['Makes code clearer','Encrypts a page','Shrinks code and shortens names'],2]],
x:[['Where can you read the JavaScript of a page?',['Nowhere','In the browser developer tools','Only on the server'],1],['Why test on an emulator?',['To protect your personal device','To make it free','To skip permissions'],0]]},
{t:'Firmware & Embedded Systems',c:'#ffd9b3',d:'Study the software inside devices such as routers and cameras.',
intro:['Many everyday devices contain a small computer with its own software. Reverse engineering that software helps check device security, even when you only have the update file.'],
gl:[['Firmware','The software stored permanently inside a device.'],['Embedded system','A small computer built into a device to do one job.'],['File system','The way files and folders are organized in storage.'],['Bootloader','The first small program that runs when a device starts.']],
sec:[['What firmware is','Firmware is the software that makes a device work, from a router to a smart lamp. It is usually updated through a firmware image, a single file holding the bootloader, the operating system and the files. Devices use many processor types, such as ARM, so the assembly you read may differ from the PC examples, but the ideas stay the same.','A device with a firmware image split into parts.'],['Getting and unpacking firmware','You can often download the update from the maker site. A tool such as binwalk searches the image for known markers and extracts the parts, including the file system. After extraction you can browse folders and configuration files like on a normal computer, and look for default passwords, hidden services and programs to analyze statically.','A firmware image unpacked into folders.'],['Analyzing and testing safely','Study the extracted programs with the static methods from earlier chapters, and run the device software in an emulator when possible, so no real device is risked. Check what the device sends on the network and which accounts it has. Report weaknesses to the maker using responsible disclosure.','A checklist: unpack, read, emulate, report.']],
tut:[['List devices','Name five devices at home that probably contain firmware.'],['Plan an unpacking','Write the steps from downloading an update to browsing its files.'],['Find the risk','A device ships with the password admin. Explain the risk and what to report.']],
quiz:[['What is firmware?',['Software stored inside a device','A website','A virus'],0],['What does a bootloader do?',['Draws pictures','Runs first when a device starts','Encrypts the network'],1],['What does binwalk help with?',['Compiling code','Typing faster','Finding and extracting parts of a firmware image'],2]],
x:[['A single file used to update a device is called\u2026',['A firmware image','A packet','A snapshot'],0],['How should you report a weakness you find?',['Publish it at once','Privately to the maker','Keep it secret forever'],1]]},
{t:'Electronics Reverse Engineering',c:'#b8f0e0',d:'Discover how a circuit board works and rebuild its diagram.',
intro:['Computers and devices are built from electronic circuits. Reverse engineering electronics means studying a real circuit board to learn which parts it holds and how they are connected, even without the maker documents. It links the software chapters to the hardware they run on.'],
gl:[['Voltage','The push that makes electric charges move, measured in volts (V).'],['Current','How much electric charge flows, measured in amperes (A).'],['Resistance','How strongly a part resists the flow, measured in ohms.'],['Circuit','A closed loop of connected parts through which current can flow.'],['PCB','A printed circuit board: a board whose copper tracks connect the parts.'],['Schematic','A drawing that shows parts as symbols and their connections as lines.']],
sec:[['Electricity in simple words','Electricity is the flow of tiny charges through a material. Voltage is the push, current is how much flows, and resistance is how much a part resists. They are linked by Ohm law: voltage = current x resistance, so a 10-ohm part carrying 2 amperes has 20 volts across it. A circuit works only while its loop is closed; if the loop is broken, nothing flows.','A battery, a wire loop and a resistor with voltage, current and resistance labeled.'],['Common components and the circuit board','A resistor limits current. A capacitor stores a little charge and smooths changes. A diode lets current pass in one direction only. A transistor works as a tiny switch. An integrated circuit, or chip, packs thousands to billions of these parts into one package. All of them sit on a PCB. Parts carry markings such as a value or a chip name, which you can look up in a datasheet, the document where the maker describes the part.','A PCB with a labeled resistor, capacitor, diode and chip.'],['Measuring and observing a circuit','A multimeter measures voltage, current and resistance, and its continuity mode beeps when two points are connected by a conductor. An oscilloscope draws a signal, a voltage changing over time, so you can see its shape and speed. A logic analyzer records digital signals, which are only high or low, like 1 and 0. Work with the board unplugged whenever you can, use only low-voltage devices, and never open mains-powered equipment.','A multimeter probing a board and an oscilloscope trace.'],['Rebuilding the schematic and talking to chips','To rebuild a schematic, photograph the board, label every part, trace each copper track with the continuity mode and write the connections down. Many chips talk over a serial link such as UART, a simple connection of two wires that sends data one bit at a time. If you find its pins, a monitor tool can show that traffic, which connects to the firmware chapter. Finish by comparing your schematic with the real board, and respect licenses and law.','A photographed board, a traced track and the final schematic.']],
tut:[['Use Ohm law','A part of 5 ohms carries 3 amperes. How many volts are across it? (Answer: 15)'],['Name the part','Match each part to its job: resistor, capacitor, diode, transistor; jobs: limits current, stores charge, one-way gate, tiny switch.'],['Plan a trace','Write the steps from taking photos of a board to drawing its schematic.']],
quiz:[['What does a resistor do?',['Stores charge','Limits current','Amplifies light'],1],['What does continuity mode on a multimeter tell you?',['The temperature','The speed of a chip','Whether two points are connected'],2],['What is a datasheet?',['The maker document describing a part','A test report','A kind of circuit board'],0]],
x:[['Ohm law links voltage, current and\u2026',['Resistance','Weight','Color'],0],['Which instrument draws a signal over time?',['A caliper','An oscilloscope','A ruler'],1]]}];

INTRO:{0:['Un ordinateur ne peut pas lire les programmes tels que les personnes les écrivent. Il suit seulement des instructions très simples faites de nombres. Dans ce chapitre, vous apprenez pas à pas comment un programme écrit par une personne devient quelque chose qu’un ordinateur peut exécuter.','La rétro-ingénierie consiste à étudier un produit fini pour comprendre comment il a été fabriqué. Ici, le produit est un programme : nous apprenons donc d’abord comment les programmes sont créés.'],1:['L’assembleur est la forme la plus lisible du code machine. Apprendre quelques instructions permet de lire la plupart des programmes. Nous utilisons comme exemple la famille de processeurs x86, présente dans la plupart des PC.']},
GL:{0:[['Programme','Une liste d’instructions qui dit à un ordinateur ce qu’il doit faire.'],['Code source','Le programme tel qu’un humain l’écrit, dans un langage lisible comme Python ou C.'],['Binaire','Une façon d’écrire les nombres avec seulement 0 et 1. Les ordinateurs stockent tout ainsi.'],['Code machine','Les instructions d’un programme écrites en binaire, le seul langage que l’ordinateur comprend.'],['Compilateur','Un outil qui traduit le code source en code machine.'],['Exécutable','Un fichier qui contient du code machine et que l’on peut lancer, comme un fichier .exe.']],
1:[['Instruction','Une minuscule commande pour le processeur, comme copier ou additionner.'],['Registre','Une très petite boîte de stockage très rapide à l’intérieur du processeur.'],['Opérande','La valeur ou l’endroit sur lequel travaille une instruction, comme les nombres dans add a, b.'],['Indicateur','Une note d’un bit que le processeur positionne après une instruction, par exemple si un résultat était nul.']]},
SEC:{0:[['Comment un programme est créé','Les gens écrivent les programmes en code source, qui ressemble un peu à de l’anglais avec des règles strictes. Un ordinateur ne peut pas le comprendre directement : un compilateur (un programme traducteur) le convertit donc en code machine. Un second outil assemble ensuite toutes les pièces en un seul fichier fini, appelé exécutable. Quand vous double-cliquez sur une application, vous lancez un exécutable. Après la traduction, les noms d’origine et les commentaires sont généralement perdus, ce qui fait de la rétro-ingénierie un puzzle à résoudre.','Le code source entre dans le compilateur et un fichier exécutable en sort.'],['Pourquoi les ordinateurs utilisent 0 et 1','Un ordinateur est fait de minuscules interrupteurs, éteints ou allumés. On écrit éteint 0 et allumé 1. Un seul 0 ou 1 s’appelle un bit, et un groupe de 8 bits est un octet. Avec des bits, on écrit des nombres : 101 en binaire vaut 5, car cela compte 4 + 0 + 1. Les lettres sont aussi stockées sous forme de nombres : la lettre A est le nombre 65. Les longs nombres binaires sont difficiles à lire, on utilise donc souvent l’hexadécimal (base 16, chiffres de 0 à 9 et de A à F), où FF vaut 255.','Une rangée d’interrupteurs montrant des bits et le nombre 5.'],['Ce que fait le processeur','Le processeur, aussi appelé CPU, est le cerveau de l’ordinateur. Il répète un cycle simple : chercher la prochaine instruction en mémoire (l’endroit où sont gardés les programmes en cours et leurs données), la comprendre, puis l’exécuter. Le CPU possède quelques petites boîtes de stockage très rapides appelées registres, où il garde les nombres avec lesquels il travaille. Chaque instruction est minuscule, comme copier un nombre ou additionner deux nombres, mais des milliards par seconde rendent possibles des programmes complexes.','Le CPU cherchant des instructions en mémoire et utilisant des registres.'],['Où un programme en cours garde ses données','Pendant qu’un programme s’exécute, ses données vivent en mémoire. Deux zones comptent surtout. La pile est un tas bien rangé qui sert aux notes temporaires de chaque fonction (une fonction est une partie nommée d’un programme qui accomplit un petit travail) : quand une fonction démarre, une nouvelle note est posée au-dessus, et quand elle se termine, la note est retirée. Le tas est une zone libre plus grande où un programme demande de la place quand il en a besoin. Le savoir aide à suivre un programme pas à pas.','Une pile de notes qui grandit et diminue, à côté du tas.']],
1:[['Instructions et registres','Une ligne d’assembleur comporte un nom d’instruction et des opérandes, comme mov eax, 5, qui copie le nombre 5 dans le registre nommé eax. D’autres instructions courantes sont add (additionner), sub (soustraire) et cmp (comparer deux valeurs). Le x86 donne aux registres des noms comme eax, ebx, ecx et edx pour le travail général. Lire de l’assembleur, c’est suivre quel registre contient quelle valeur après chaque ligne.','Une instruction avec son nom et ses opérandes annotés.'],['Décisions et boucles','Après cmp, le processeur positionne des indicateurs, par exemple « zéro » quand les deux valeurs étaient égales. Une instruction de saut utilise ces indicateurs : l’instruction je saute si égal, jne saute si différent et jmp saute toujours. Un saut en arrière crée une boucle, où les mêmes lignes se répètent. Ainsi, cmp suivi de je est la façon d’écrire un « si » en assembleur.','Une comparaison suivie d’une flèche de saut.'],['Fonctions, pile et exemple détaillé','Pour utiliser une fonction, le programme emploie call, qui enregistre sur la pile l’endroit où revenir et saute dans la fonction ; ret revient. L’instruction push met une valeur sur la pile et pop la retire. Exemple : mov eax, 2 puis add eax, 3 puis cmp eax, 5 puis je done. Le registre eax devient 5, la comparaison trouve des valeurs égales et le saut vers done est effectué.','Un tableau d’étapes montrant eax passer de 2 à 5.']]},
TUT:{0:[['Écrire des nombres en binaire','Sur papier, écrivez 1 à 8 en binaire : 1, 10, 11, 100, 101, 110, 111, 1000.'],['Décoder une lettre','La lettre A vaut 65. Trouvez quelles lettres valent 66 et 67.'],['Dessiner la chaîne','Dessinez des cases pour le code source, le compilateur, l’exécutable et le CPU, reliées par des flèches.']],
1:[['Suivre à la main','Suivez mov a, 4 puis add a, 6 puis sub a, 3 et écrivez a après chaque ligne. (Réponse : 4, 10, 7)'],['Décider du saut','Si cmp compare 7 et 7 puis que je suit, le saut est-il effectué ? (Oui)'],['Décrire une boucle','Décrivez avec des mots une boucle qui ajoute 1 à un compteur jusqu’à ce qu’il vaille 5.']]},
OBJ:['Expliquer simplement comment un programme est écrit, traduit et exécuté par un ordinateur.','Lire et convertir le binaire, l’hexadécimal et des instructions d’assembleur simples.','Étudier un programme sans l’exécuter, avec des désassembleurs, des chaînes de caractères et des graphes de flux de contrôle.','Étudier un programme en cours d’exécution en sécurité, avec des machines virtuelles, des instantanés, des débogueurs et des journaux.','Décrire comment les failles, les programmes malveillants et les incidents sont investigués.','Appliquer les règles légales, éthiques et de divulgation responsable à chaque analyse.'],
